<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>원클릭 격리 시험 상태</title><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}body{font-family:sans-serif;margin:0 auto;padding:12px;max-width:640px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;word-break:keep-all}
h1{font-size:18px;margin:4px 0 8px;line-height:1.3}h2{font-size:15px;margin:16px 0 6px}
p{margin:6px 0}code{font-size:12px;overflow-wrap:anywhere;word-break:break-all}.note code{word-break:normal}
.card{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0;background:#fff}
.row{display:flex;flex-wrap:wrap;gap:2px 8px;margin:2px 0}.k{color:#666;min-width:0;flex:0 0 auto}.v{flex:1 1 140px;min-width:0}
.ok{color:#0a7}.ng{color:#c22}.warn{color:#b60}.note{color:#555;font-size:13px}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;color:#fff;max-width:100%;overflow-wrap:anywhere}.b-ok{background:#0a7}.b-warn{background:#c80}.b-ng{background:#c22}
</style></head>
<body><h1>원클릭 격리 시험 상태</h1>
<p class="note">194-test/auto-test · 정식 사이트 데이터가 아닌 <b>격리 시험본</b>입니다. 실행: GitHub Actions <i>oneclick-autotest</i> → Run workflow.</p>
<p class="note">일일 갱신은 FunETF 가격·NAV·분배금만 수집하고, 상품 메타는 <b>저장된 승인 메타</b>를 씁니다. <code>metadata=stored</code>, <code>metadata_refresh=skipped</code> 는 정상입니다. ZeroIn 일일 호출은 없습니다. 실패·차단 시 최신본(latest)은 바뀌지 않습니다.</p>
<h2>최신 격리본</h2><div id="latest" class="card">불러오는 중…</div>
<h2>실행 이력</h2><div id="runs"></div>
<script>
const nc={cache:'no-store'};const E=s=>String(s??'-').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sha(b){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const bc=r=>r==='PASS_PROMOTED'?'b-ok':(String(r).startsWith('PASS_PROMOTED')?'b-warn':'b-ng');
const SS={updated:'갱신',partly_unchanged:'일부 미변경(정상)',unchanged_all:'원천 미변경·휴장(정상)',collection_error:'수집 오류'};
const row=(k,v)=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
(async()=>{
 try{const L=await (await fetch('latest.json?t='+Date.now(),nc)).json();
  const mb=await (await fetch(L.path+'manifest.json',nc)).arrayBuffer();const msha=await sha(mb);const M=JSON.parse(new TextDecoder().decode(mb));
  const cb=await (await fetch(L.path+'data/catalog.json',nc)).arrayBuffer();const csha=await sha(cb);
  const same=M.release_id===L.release_id&&msha===L.manifest_sha256&&csha===M.files['data/catalog.json'];
  const Z=L.metadata||M.metadata;const st=L.status||'PASS_PROMOTED (구버전)';const P=L.paydate;
  document.getElementById('latest').innerHTML=`<div><span class="badge ${bc(st)}">${E(st)}</span>${st==='PASS_PROMOTED'?'':' <b class="warn">⚠ 경고 확인</b>'}</div>`+
   row('release',`<code>${E(L.release_id)}</code>`)+row('승격',E(L.promoted_kst))+row('기준일·종목',`${E(L.max_cutoff)} · ${Object.keys(M.cutoffs).length}종 · QA ${E(L.qa)}`)+
   row('원천 상태',E(SS[L.source_state]||L.source_state||'구버전(미기록)'))+
   row('메타',Z?`metadata=${E(Z.metadata)} · refresh=${E(Z.metadata_refresh)} · 저장 유지 ${Z.stored}/${Z.total} · 재사용 ${Z.site_baseline_only} · 유실 ${Z.lost_or_changed} · 기존 공란 ${E(Z.baseline_gap_preexisting)}`:'구버전(미기록)')+
   row('지급일',P?`실제 ${P.out.actual} · 예상 ${P.out.estimated} · 이번 신규 ${P.added}`:'구버전(미기록)')+
   row('무결성',`<b class="${same?'ok':'ng'}">${same?'일치':'불일치'}</b> <code>${msha.slice(0,16)}…</code>`)+row('이전본',`<code>${E(L.previous)}</code>`);
 }catch(e){document.getElementById('latest').textContent='최신 격리본 없음 또는 읽기 실패: '+e}
 try{const R=await (await fetch('runs/index.json?t='+Date.now(),nc)).json();const t=document.getElementById('runs');
  for(const r of R.slice(0,30)){const c=r.collect||{},m=r.metadata;
   t.insertAdjacentHTML('beforeend',`<div class="card"><div><span class="badge ${bc(r.result)}">${E(r.result)}</span></div>`+row('release',`<code>${E(r.release_id)}</code>`)+
   row('수집',`갱신 ${c.updated||0} · 무변화 ${c.no_change_normal||0} · 실패 ${c.fail||0}${r.source_state?' · '+E(SS[r.source_state]||r.source_state):''}`)+
   row('메타',m?`저장 ${m.stored}/${m.total} · 재사용 ${m.site_baseline_only} · 유실 ${m.lost_or_changed}`:(r.zeroin?'(구) ZeroIn '+r.zeroin.fresh+'/'+r.zeroin.total:'-'))+
   ((r.qa_fail||[]).length?row('QA 실패',E(r.qa_fail.join(', '))):'')+'</div>')}
 }catch(e){}
})();
</script></body></html>
